name: 公開終了（2026年12月1日）
# 日本時間 2026-12-01 0:05 に、しおりを「公開終了」ページへ差し替え、表紙画像などを削除する。
on:
  schedule:
    - cron: '5 15 30 11 *'   # UTC 11/30 15:05 = 日本時間 12/1 0:05
  workflow_dispatch:
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 公開終了ページに差し替える
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then exit 0; fi
          cp closed.html index.html
          git rm -q --ignore-unmatch cover.png cover.jpg
          git rm -rq --ignore-unmatch tools
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "公開期間終了：しおりを公開終了ページに差し替え" || exit 0
          git push
